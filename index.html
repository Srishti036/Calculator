<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="calculator">
            <label for="screen">
                <input type="text" id="screen" value="">
            </label>
        <div class="buttons">
            <button class="button" value="1">1</button>
            <button class="button" value="2">2</button>
            <button class="button" value="3">3</button>
            <button class="operator" value="+">+</button>
            <button class="button" value="4">4</button>
            <button class="button" value="5">5</button>
            <button class="button" value="6">6</button>
            <button class="operator" value="-">-</button>
            <button class="button" value="7">7</button>
            <button class="button" value="8">8</button>
            <button class="button" value="9">9</button>
            <button class="operator" value="*"><i class="fa-solid fa-xmark"></i></button>
            <button value="" class="clear" onclick="clearScr()">C</button>
            <button class="button" value="0">0</button>
            <button value="=" class="result" onclick="calculate()">=</button>
            <button class="operator" value="/"><i class="fa-solid fa-divide"></i></button>
        </div>
    </div>
    <script src="script.js">sss</script>
</body>
</html>
